name: karma
description: "Karma — What you give is what you get. HR companion app."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.6.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  # State Management
  flutter_riverpod: 3.0.3
  riverpod_annotation: 3.0.3
  # Networking
  api:
    path: ./api
  dio: 5.9.0
  # Routing
  auto_route: 10.2.3
  # Database
  shared_preferences: 2.5.3
  flutter_secure_storage: 10.3.1
  # UI Helper / Utils
  google_fonts: 6.3.2
  phosphor_flutter: 2.1.0
  gap: 3.0.1
  flutter_svg: 2.2.3
  cached_network_image: 3.4.1
  intl: 0.20.2
  url_launcher: 6.3.2
  connectivity_plus: 7.0.0
  package_info_plus: 9.0.0
  collection: 1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.7.1
  riverpod_generator: 3.0.3
  auto_route_generator: 10.2.6
  flutter_gen_runner: 5.12.0

flutter:
  uses-material-design: true
  assets:
    - assets/svg/
    - assets/images/

flutter_gen:
  output: lib/src/gen/
  integrations:
    flutter_svg: true
